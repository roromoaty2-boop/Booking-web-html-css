<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0
        ,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;
        1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" href="./css/login.css" />
    <title>Rihla - Login</title>
</head>
<body>
    



    <section class="welcome-login">


        <img src="./asssests/Mask group.png" alt="Mask-group" class="Mask-group" />


        <div class="logo">


            <img src="./asssests/Navbar.png" alt="nav-logo">
            <div class="logo-text">
                <h1><span class="Rih">Rih</span><span class="la">la</span></h1>
                <p>EGYPT TRAVEL</p>
            </div>

        </div>



        

        <div class="welcome">
            <h1>Welcome Back</h1>
            <p>Sign in to your account to continue your journey</p>
        </div>


        <div class="login-inputs"> 



            <form action="">

                <div class="Email">
                    <label for="">Email Adress</label>
                    <input type="email" name="" id="" placeholder="example@gmail.com"/>
                </div>
                

                <div class="password">
                    <label for="">Password</label>
                    <input type="password" placeholder="******"/>
                </div>
                


            </form>


            <div class="inputs-save">
                <div class="inputs-save-edit">
                    <input type="radio">
                    <label for="">Remember me</label> 
                </div>
                

                <p><a href="./forgot-password.html" target="_blank">Forgot Password?</a></p>

            </div>
            
            <div class="login-btn">
                <button><a href="./home.html" target="_blank">Login</a></button>
            </div>

        </div>


        <div class="continue-title">
            <span></span>
            <p>Or continue with</p>
            <span></span>
        </div>


        <div class="social-btn">

            <button id="social-media">
                <img src="./asssests/google-icon.png" alt="google">
                Google
            </button>


            <button id="social-media">
                <img src="./asssests/apple-icon.png" alt="apple">
                Apple
            </button>

        </div>


        <div class="creat-account">

            <p>
                Don't have an account? <span><a href="./signup.html" target="_blank">Create account</a></span>
            </p>

        </div>

    </section>



</body>
</html>
