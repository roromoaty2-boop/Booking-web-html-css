<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0
        ,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;
        1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" href="./css/signup.css" />
    <title>Rihla - Sign up</title>
</head>
<body>


    <section class="create-signup">


        <img src="./asssests/Mask group.png" alt="Mask-group" class="Mask-group" />


        <div class="logo">


            <img src="./asssests/Navbar.png" alt="nav-logo">
            <div class="logo-text">
                <h1><span class="Rih">Rih</span><span class="la">la</span></h1>
                <p>EGYPT TRAVEL</p>
            </div>

        </div>




        <div class="create-acc">
            <h1>Create Account</h1>
            <p>Join 50,000+ travelers exploring Egypt</p>
        </div>



        <div class="create-input">

            <form action="">

                <div class="Full-name">

                    <form action="">

                        <div class="Full-name">

                            <label for="">Full Name</label>
                            <input type="text" placeholder="Name" />

                        </div>


                        <div class="Email">

                            <label for="">Email Address</label>
                            <input type="email" placeholder="Name@gmail.com"/>

                        </div>
                        <div class="Password">
                            <label for="">Password</label>
                            <input type="password" placeholder="*****"/>
                        </div>
                        <div class="Confirm-Password">
                            <label for="">Confirm Password</label>
                            <input type="password" placeholder="*****"/>
                        </div>


                    </form>
                </div>

               
                


            </form>


            <div class="login-btn">
                <button><a href="./home.html" target="_blank">Login</a></button>
            </div>


            <div class="Signin">

                <p>
                    have an account? <span><a href="./login.html" target="_blank">Signin</a></span>
                </p>

            </div>




        </div>


    </section>




</body>
</html>
